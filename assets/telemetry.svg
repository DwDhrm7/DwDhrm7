<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" role="img" aria-labelledby="t d">
<title id="t">Sensor dashboard preview</title>
<desc id="d">An animated illustration of a smart-farm dashboard with gauges and a streaming line chart. The data is illustrative.</desc>
<style>
:root { --bg:#f6f8fa; --card:#ffffff; --ink:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#1a7f37; --soft:#eaeef2; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --card:#0d1117; --ink:#e6edf3; --muted:#7d8590; --line:#30363d; --accent:#3fb950; --soft:#161b22; }
}
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.bg { fill: var(--bg); } .card { fill: var(--card); stroke: var(--line); }
.frame { fill:none; stroke: var(--line); }
.ink { fill: var(--ink); } .muted { fill: var(--muted); } .accent { fill: var(--accent); }
.soft { fill: var(--soft); }
.sline { fill:none; stroke: var(--line); }
.saccent { fill:none; stroke: var(--accent); stroke-linecap:round; stroke-linejoin:round; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.live { animation: livepulse 2s ease-in-out infinite; } @keyframes livepulse { 50% { opacity:.25 } }
.v { opacity:0; } .v0 { opacity:1; }
@keyframes v0 { 0%,24.9% { opacity:1 } 25%,100% { opacity:0 } } .v0 { animation: v0 12s linear infinite; }
@keyframes v1 { 0%,24.9% { opacity:0 } 25%,49.9% { opacity:1 } 50.0%,100% { opacity:0 } } .v1 { animation: v1 12s linear infinite; }
@keyframes v2 { 0%,49.9% { opacity:0 } 50%,74.9% { opacity:1 } 75.0%,100% { opacity:0 } } .v2 { animation: v2 12s linear infinite; }
@keyframes v3 { 0%,74.9% { opacity:0 } 75%,99.9% { opacity:1 } 100.0%,100% { opacity:0 } } .v3 { animation: v3 12s linear infinite; }
@keyframes g0 { 0% { stroke-dashoffset:50.0 } 25% { stroke-dashoffset:48.0 } 50% { stroke-dashoffset:45.0 } 75% { stroke-dashoffset:50.0 } 100% { stroke-dashoffset:50.0 } } .ga0 { stroke-dasharray:100; stroke-dashoffset:50.0; animation: g0 12s ease-in-out infinite; }
@keyframes g1 { 0% { stroke-dashoffset:28.0 } 25% { stroke-dashoffset:27.0 } 50% { stroke-dashoffset:26.0 } 75% { stroke-dashoffset:27.0 } 100% { stroke-dashoffset:28.0 } } .ga1 { stroke-dasharray:100; stroke-dashoffset:28.0; animation: g1 12s ease-in-out infinite; }
@keyframes g2 { 0% { stroke-dashoffset:55.0 } 25% { stroke-dashoffset:54.0 } 50% { stroke-dashoffset:52.0 } 75% { stroke-dashoffset:55.0 } 100% { stroke-dashoffset:55.0 } } .ga2 { stroke-dasharray:100; stroke-dashoffset:55.0; animation: g2 12s ease-in-out infinite; }
.scroll { animation: scroll 10s linear infinite; } @keyframes scroll { to { transform: translateX(-272px); } }</style>
