<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 168" width="440" height="168" role="img" aria-labelledby="t d">
<title id="t">SIKAT</title>
<desc id="d">Karate exam system: signup, payment, tablet scoring.</desc>
<style>
:root { --bg:#f6f8fa; --card:#ffffff; --ink:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#1a7f37; --soft:#eaeef2; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --card:#0d1117; --ink:#e6edf3; --muted:#7d8590; --line:#30363d; --accent:#3fb950; --soft:#161b22; }
}
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.bg { fill: var(--bg); } .card { fill: var(--card); stroke: var(--line); }
.frame { fill:none; stroke: var(--line); }
.ink { fill: var(--ink); } .muted { fill: var(--muted); } .accent { fill: var(--accent); }
.soft { fill: var(--soft); }
.sline { fill:none; stroke: var(--line); }
.saccent { fill:none; stroke: var(--accent); stroke-linecap:round; stroke-linejoin:round; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.enter { animation: enter .8s cubic-bezier(.2,.7,.2,1) backwards; }
@keyframes enter { from { opacity:0; transform: translateY(8px); } }
.sc { animation: sc 7s linear infinite; } @keyframes sc { to { transform: translateX(-120px); } }
.bar { transform-box: fill-box; transform-origin: bottom; animation: bar 1.6s ease-in-out infinite; } @keyframes bar { 50% { transform: scaleY(.45); } }
.ring { opacity:.25; transform-box: fill-box; transform-origin:center; animation: ring 3s ease-out infinite; } @keyframes ring { from { transform: scale(.3); opacity:.6; } to { transform: scale(1.5); opacity:0; } }
.route { animation: route 2.4s linear infinite; } @keyframes route { to { stroke-dashoffset: -18; } }
.ripple { transform-box: fill-box; transform-origin:center; animation: ripple 2.4s ease-out infinite; } @keyframes ripple { from { transform: scale(1); opacity:.7; } to { transform: scale(3.2); opacity:0; } }
.tick { stroke-dasharray: 20; animation: tick 4s ease infinite; } @keyframes tick { 0% { stroke-dashoffset:20; } 12%,88% { stroke-dashoffset:0; } 100% { stroke-dashoffset:20; } }
.grow { transform-box: fill-box; transform-origin:left; animation: grow 3.6s ease-in-out infinite; } @keyframes grow { 0% { transform: scaleX(.15); } 50% { transform: scaleX(1); } 100% { transform: scaleX(.15); } }
.cur { animation: curs 1s steps(1) infinite; } @keyframes curs { 50% { opacity:0; } }
</style>
<g class="enter" style="animation-delay:0.36s">
<rect class="card" x="0.5" y="0.5" width="439" height="167" rx="10"/>
<text class="mono ink" x="24" y="38" font-size="16" font-weight="700">SIKAT</text>
<text class="mono muted" x="24" y="66" font-size="12.5">Karate exam system: signup,</text>
<text class="mono muted" x="24" y="86" font-size="12.5">payment, tablet scoring.</text>
<line class="sline" x1="24" y1="122" x2="270" y2="122"/>
<text class="mono accent" x="24" y="146" font-size="11.5">Next.js · Supabase · RLS</text>
<g transform="translate(294,38)">
<rect class="soft" x="0" y="6" width="120" height="16" rx="4"/><rect class="muted" x="8" y="12" width="50" height="4" rx="2" opacity=".6"/>
<path class="saccent tick" d="M98 14 l4 4 l9 -9" stroke-width="2" style="animation-delay:0.5s"/>
<rect class="soft" x="0" y="28" width="120" height="16" rx="4"/><rect class="muted" x="8" y="34" width="63" height="4" rx="2" opacity=".6"/>
<path class="saccent tick" d="M98 36 l4 4 l9 -9" stroke-width="2" style="animation-delay:0.95s"/>
<rect class="soft" x="0" y="50" width="120" height="16" rx="4"/><rect class="muted" x="8" y="56" width="76" height="4" rx="2" opacity=".6"/>
<path class="saccent tick" d="M98 58 l4 4 l9 -9" stroke-width="2" style="animation-delay:1.4s"/>
<rect class="soft" x="0" y="72" width="120" height="16" rx="4"/><rect class="muted" x="8" y="78" width="59" height="4" rx="2" opacity=".6"/>
<path class="saccent tick" d="M98 80 l4 4 l9 -9" stroke-width="2" style="animation-delay:1.85s"/>
</g>
